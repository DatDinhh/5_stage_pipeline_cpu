<title id="title">Byte lanes: select the addressed byte before sign extension</title>
<desc id="desc">Real Icarus VCD transitions. Fault-injected isolated mutation compared with current repaired RTL. Absolute simulation time in nanoseconds; delta updates at a timestamp show their final settled value.</desc>
<style>text{font-family:Arial,sans-serif}.mono{font-family:Consolas,monospace}</style>
<rect width="1360" height="1038" fill="#f5f7fb"/>
<text x="44" y="43" font-size="13" fill="#526780" >MEASURED RTL WAVEFORMS / TWO CONTROLLED RUNS</text>
<text x="44" y="82" font-size="28" fill="#11263f" >Byte lanes: select the addressed byte before sign extension</text>
<text x="44" y="111" font-size="16" fill="#25364b" >lb r3, 2(r10), r10 = 0x40     |     RAM word = 0x80ff7f01; offset 2 is 0xff, so signed LB must produce 0xffffffff</text>
<text x="44" y="139" font-size="13" fill="#526780" >True VCD transitions · 10 ns clock · axes show absolute simulation time (ns) · final delta value at each timestamp</text>
