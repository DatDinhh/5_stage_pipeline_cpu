<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Five-stage CPU: system architecture</title>
  <desc id="desc">The synthesizable cpu_core contains a fetch front end, an in-order pipeline, general-purpose registers, and control/status registers. Separate custom ready/valid instruction and data buses connect to external memory. Simulation uses rv_rom and rv_mem models. Registered retirement and debug outputs let the verification environment observe execution.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563eb"/></marker>
    <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#0f766e"/></marker>
    <marker id="purple-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1280" height="800" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="51" font-size="31" font-weight="700" fill="#0f172a">One CPU core, two memory interfaces</text>
    <text x="48" y="84" font-size="17" fill="#475569">32-bit MIPS-like subset · single issue · in order · five pipeline stages</text>
    <rect x="320" y="145" width="640" height="430" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="350" y="185" font-size="23" font-weight="700" fill="#1e3a8a">cpu_core</text>
    <text x="350" y="211" font-size="15" fill="#475569">Synthesized RTL boundary · clock, reset and testbench control inputs</text>

    <rect x="350" y="255" width="170" height="190" rx="13" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="368" y="286" font-size="20" font-weight="700" fill="#1e3a8a">IF front end</text>
    <text x="368" y="321" font-size="16" fill="#334155">PC + predictor</text>
    <text x="368" y="350" font-size="16" fill="#334155">Request owner</text>
    <text x="368" y="377" font-size="16" fill="#334155">Outstanding owner</text>
    <text x="368" y="404" font-size="16" fill="#334155">Response buffer</text>
    <path d="M520 309 H563" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>

    <rect x="565" y="255" width="365" height="112" rx="13" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="585" y="286" font-size="21" font-weight="700" fill="#1e3a8a">ID → EX → MEM → WB</text>
    <text x="585" y="316" font-size="16" fill="#334155">Decode · execute · memory · commit</text>
    <text x="585" y="342" font-size="15" fill="#475569">Valid records retain each instruction's state</text>
    <rect x="565" y="394" width="173" height="127" rx="13" fill="#fff" stroke="#bfdbfe"/>
    <text x="583" y="425" font-size="18" font-weight="700" fill="#1e3a8a">CSRs / counters</text>
    <text x="583" y="454" font-size="15" fill="#334155">Trap EPC + cause</text>
    <text x="583" y="479" font-size="15" fill="#334155">Internal CSR reads</text>
    <text x="583" y="502" font-size="14" fill="#64748b">No external RAM access</text>
    <rect x="755" y="394" width="175" height="127" rx="13" fill="#fff" stroke="#bfdbfe"/>
    <text x="773" y="425" font-size="18" font-weight="700" fill="#1e3a8a">Register file</text>
    <text x="773" y="454" font-size="15" fill="#334155">32 × 32-bit GPRs</text>
    <text x="773" y="479" font-size="15" fill="#334155">Read in ID</text>
    <text x="773" y="502" font-size="15" fill="#334155">Write in WB · r0 = 0</text>
    <text x="350" y="553" font-size="15" fill="#475569">Forwarding, interlocks and redirects coordinate the pipeline.</text>

    <rect x="48" y="255" width="200" height="190" rx="15" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <text x="68" y="289" font-size="21" font-weight="700" fill="#115e59">Instruction</text>
    <text x="68" y="317" font-size="21" font-weight="700" fill="#115e59">memory</text>
    <text x="68" y="354" font-size="16" fill="#334155">External to cpu_core</text>
    <text x="68" y="384" font-size="15" fill="#475569">Simulation model:</text>
    <text x="68" y="411" font-size="17" font-weight="600" fill="#0f766e">rv_rom.v</text>
    <path d="M350 295 H250" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
    <text x="286" y="282" text-anchor="middle" font-size="14" fill="#1d4ed8">request</text>
    <path d="M248 345 H348" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#teal-arrow)"/>
    <text x="286" y="333" text-anchor="middle" font-size="14" fill="#0f766e">response</text>
    <text x="299" y="388" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">ibus</text>

    <rect x="1032" y="255" width="200" height="190" rx="15" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <text x="1052" y="289" font-size="21" font-weight="700" fill="#115e59">Data memory</text>
    <text x="1052" y="326" font-size="16" fill="#334155">External to cpu_core</text>
    <text x="1052" y="354" font-size="16" fill="#334155">Load / store + strobes</text>
    <text x="1052" y="384" font-size="15" fill="#475569">Simulation model:</text>
    <text x="1052" y="411" font-size="17" font-weight="600" fill="#0f766e">rv_mem.v</text>
    <path d="M930 295 H1030" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
    <text x="991" y="282" text-anchor="middle" font-size="14" fill="#1d4ed8">request</text>
    <path d="M1032 345 H932" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#teal-arrow)"/>
    <text x="991" y="333" text-anchor="middle" font-size="14" fill="#0f766e">response</text>
    <text x="981" y="388" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">dbus</text>

    <text x="48" y="489" font-size="16" font-weight="600" fill="#0f172a">Both interfaces</text>
    <text x="48" y="516" font-size="15" fill="#475569">Custom ready / valid</text>
    <text x="48" y="541" font-size="15" fill="#475569">At most one accepted</text>
    <text x="48" y="566" font-size="15" fill="#475569">outstanding request</text>
    <text x="48" y="591" font-size="15" fill="#475569">per bus</text>
    <text x="1032" y="489" font-size="16" font-weight="600" fill="#0f172a">Memory wait</text>
    <text x="1032" y="516" font-size="15" fill="#475569">EX/MEM holds the</text>
    <text x="1032" y="541" font-size="15" fill="#475569">transaction until its</text>
    <text x="1032" y="566" font-size="15" fill="#475569">response is consumed.</text>

    <path d="M640 575 V637" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#purple-arrow)"/>
    <text x="658" y="612" font-size="15" fill="#7c3aed">Registered retirement trace + debug</text>
    <rect x="320" y="639" width="640" height="84" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <text x="344" y="671" font-size="20" font-weight="700" fill="#6b21a8">Observation outputs → verification environment</text>
    <text x="344" y="699" font-size="16" fill="#475569">PC · next PC · register writes · memory effects · trap records</text>
    <text x="48" y="766" font-size="15" fill="#64748b">Logical overview. Memory models and checkers sit outside synthesis; a hardware integration supplies compatible memory interfaces.</text>
  </g>
</svg>
